name: 'Get & Cache Dependencies'
description: 'Get dependencies and cache them for faster subsequent runs'
inputs:
  caching-enabled:
    description: 'Whether to enable caching of dependencies'
    required: false
    default: 'true'
outputs:
  used-cache:
    description: 'Whether the cache was used'
    value: ${{ steps.install.outputs.cache }}
runs:
  using: 'composite'
  steps:
    - name: Cache dependencies
      if: inputs.caching-enabled == 'true'
      id: cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true' || inputs.caching-enabled == 'true'
      id: install
      run: |
        npm ci
        echo "cache='${{ inputs.caching-enabled}}'" >> $GITHUB_OUTPUT

      shell: bash